name: Debug APK

on:
  push:
    branches:
      - main
      - 'perf/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build one phone Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      # Build only the phone's devDebug variant.
      # bundleWear=false prevents the phone build from building/embedding Wear OS.
      # universalDebugOnly=true disables ABI splits so Gradle emits one APK.
      - name: Build the single Debug APK
        run: >-
          ./gradlew --no-daemon --stacktrace
          -Pbitchord.bundleWear=false
          -Pbitchord.universalDebugOnly=true
          :app:assembleDevDebug

      - name: Verify and stage exactly one APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/dev/debug"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print)

          if [[ "${#APKS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one phone Debug APK, found ${#APKS[@]}."
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          mkdir -p dist
          cp "${APKS[0]}" dist/TUNE-13-dev-debug.apk

          mapfile -t STAGED < <(find dist -maxdepth 1 -type f -name '*.apk' -print)
          if [[ "${#STAGED[@]}" -ne 1 ]]; then
            echo "::error::The artifact staging directory must contain exactly one APK."
            exit 1
          fi

          echo "APK ready: ${STAGED[0]}"
          ls -lh "${STAGED[0]}"

      - name: Upload the single Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TUNE-13-dev-debug
          path: dist/TUNE-13-dev-debug.apk
          if-no-files-found: error
          retention-days: 7
